
services:
  postgres:
    build: .
    container_name: postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: localdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
