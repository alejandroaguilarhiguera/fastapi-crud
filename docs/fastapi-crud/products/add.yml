info:
  name: add
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}/{{prefix}}"
  body:
    type: json
    data: |-
      {
        "name":"{{$randomProductName}}",
        "price":"{{$randomPrice}}",
        "description":"{{$randomAdjective}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 success
    request:
      url: "{{server}}/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name":"{{$randomProduct}}",
            "price":"{{$randomPrice}}",
            "description":"{{$randomAdjective}}"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: date
          value: Sun, 18 Oct 2026 01:32:51 GMT
        - name: server
          value: uvicorn
        - name: content-length
          value: "172"
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Sausages",
            "description": "open-source",
            "price": 95.49,
            "id": 2,
            "created_at": "2026-10-18T01:32:52.036749Z",
            "updated_at": "2026-10-18T01:32:52.036749Z",
            "deleted_at": null
          }
  - name: 422 unprocessable Entity
    request:
      url: "{{server}}/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name":"Sausages"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: date
          value: Sun, 18 Oct 2026 02:10:47 GMT
        - name: server
          value: uvicorn
        - name: content-length
          value: "105"
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": [
              {
                "type": "missing",
                "loc": [
                  "body",
                  "price"
                ],
                "msg": "Field required",
                "input": {
                  "name": "Sausages"
                }
              }
            ]
          }
  - name: 422 should be a valid number
    request:
      url: "{{server}}/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name":"{{$randomProductName}}",
            "price":"{{$randomPrice}}gh",
            "description":"{{$randomAdjective}}"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: date
          value: Sun, 18 Oct 2026 02:12:05 GMT
        - name: server
          value: uvicorn
        - name: content-length
          value: "154"
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": [
              {
                "type": "float_parsing",
                "loc": [
                  "body",
                  "price"
                ],
                "msg": "Input should be a valid number, unable to parse string as a number",
                "input": "150.59gh"
              }
            ]
          }
