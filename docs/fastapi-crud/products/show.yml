info:
  name: show
  type: http
  seq: 3

http:
  method: GET
  url: "{{server}}/{{prefix}}/88"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
