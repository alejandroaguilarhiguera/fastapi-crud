    request:
      url: "{{server}}/products/1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: date
          value: Sun, 18 Oct 2026 02:05:01 GMT
        - name: server
          value: uvicorn
        - name: content-length
          value: "167"
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Bacon",
            "description": "bluetooth",
            "price": 16.65,
            "id": 1,
            "created_at": "2026-10-18T01:32:49.360180Z",
            "updated_at": "2026-10-18T01:32:49.360180Z",
            "deleted_at": null
          }
  - name: 404 not found
    request:
      url: "{{server}}/products/88"
      method: GET
    response:
      status: 404
